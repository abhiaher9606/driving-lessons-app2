<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DRIVING LESSONS — Training Manager</title>
<meta name="theme-color" content="#F5B700" />
<meta name="description" content="Manage driving students, lessons, payments, balances, and WhatsApp progress updates." />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DriveLog" />
<style>
  @font-face { font-family: 'DL-Display'; src: local('Arial Narrow Bold'), local('Arial'); font-weight: 700; }
  :root {
    --asphalt: #22262B;
    --road-yellow: #F5B700;
    --paper: #EEF0F2;
    --card: #FFFFFF;
    --ink: #1B1E22;
    --muted: #6B7280;
    --go-green: #2F8F5B;
    --stop-red: #D64545;
    --line: #D9DCE1;
  }
  * { box-sizing: border-box; }
  html { background: var(--asphalt); }
  body { 
    margin: 0; 
    padding: 0; 
    background: var(--paper); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
  }

  button { cursor: pointer; }
  input, textarea, button { font-family: inherit; }
  .display { font-family: "Arial Narrow", "Helvetica Neue Condensed", Arial, sans-serif; font-weight: 700; letter-spacing: 0.2px; }
  #root { min-height: 100vh; }
  .phone { width: 100%; max-width: 480px; margin: 0 auto; background: var(--paper); min-height: 100vh; display: flex; flex-direction: column; position: relative; }
  
  .topbar { background: var(--asphalt);
  padding-top: 12px; 
  padding-bottom: 14px;
  padding-left: 14px;
  padding-right: 14px;
  display: flex; 
  align-items: center; 
  gap: 8px; 
  position: sticky; 
  top: 0; 
  z-index: 5;
  }
  .topbar-title { flex: 1; min-width: 0; text-align: center; color: var(--paper); font-size: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge, .icon-btn { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: none; }
  .badge { background: var(--road-yellow); }
  .icon-btn { width: 44px; 
  height: 44px; 
  border-radius: 10px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  border: none;
  background: rgba(255,255,255,0.14);
  flex-shrink: 0;
  }
  .top-side { width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .body { flex: 1; overflow-y: auto; }
  .list-wrap { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .empty { padding: 20px 4px; text-align: center; }
  .empty-title { font-size: 20px; color: var(--ink); margin-bottom: 6px; }
  .empty-body { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .student-card { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; width: 100%; margin-bottom: 10px; cursor: pointer; }
  .student-card-main { display: flex; align-items: center; gap: 12px; width: 100%; }
  .student-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--paper); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .student-name { font-size: 18px; color: var(--ink); }
  .student-meta { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
  .student-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; margin-left: 4px; }
  .action-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--asphalt); text-decoration: none; transition: background 0.15s; }
  .action-btn:hover { background: #e2e5e8; }
  .back-nav-btn { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 12px; width: 100%; }
  
  .welcome-btn { width: 100%; background: rgba(47,143,91,0.08); border: 1px solid rgba(47,143,91,0.35); border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: var(--go-green); gap: 6px; }
  
  .progress-track { position: relative; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--road-yellow); border-radius: 3px; transition: width 0.3s ease; }
  .progress-dash { position: absolute; left: 0; right: 0; top: 50%; height: 1px; border-top: 1px dashed rgba(0,0,0,0.15); }
  .fab { margin-top: 10px; margin-bottom: 12px; width: 100%; background: var(--road-yellow); border: none; border-radius: 12px; padding: 13px 16px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; color: var(--asphalt); }
  .detail-header { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .detail-meta-row { font-size: 13px; color: var(--muted); display: flex; gap: 6px; margin-bottom: 10px; }
  .hours-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
  .hours-big { font-size: 34px; color: var(--ink); line-height: 1; }
  .hours-small { font-size: 14px; color: var(--muted); }
  .summary-btn { margin-top: 10px; width: 100%; background: rgba(47,143,91,0.08); border: 1px solid rgba(47,143,91,0.35); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 600; color: var(--go-green); }
  .section-label { font-size: 16px; color: var(--ink); margin: 14px 2px 8px; }
  .timeline-row { display: flex; gap: 10px; }
  .timeline-marker-col { display: flex; flex-direction: column; align-items: center; width: 16px; padding-top: 18px; }
  .timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--road-yellow); border: 2px solid var(--asphalt); flex-shrink: 0; }
  .timeline-line { flex: 1; width: 0; border-left: 2px dashed var(--line); margin-top: 2px; }
  .lesson-card { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .lesson-top-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; gap: 6px; }
  .lesson-date, .lesson-duration { display: flex; align-items: center; gap: 5px; }
  .skill-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { font-size: 11.5px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 3px 9px; color: var(--ink); }
  .lesson-notes { font-size: 13.5px; color: var(--ink); line-height: 1.45; margin-bottom: 8px; white-space: pre-wrap; }
  .lesson-bottom-row { display: flex; justify-content: space-between; align-items: center; }
  .rating-pill { font-size: 12.5px; font-weight: 600; }
  .share-link { display: flex; align-items: center; gap: 5px; background: none; border: none; color: var(--go-green); font-size: 12.5px; font-weight: 600; padding: 0; }
  .form-wrap { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .form-subhead { font-size: 13px; color: var(--muted); margin-bottom: -6px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .input, .textarea { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 14.5px; color: var(--ink); background: var(--card); width: 100%; }
  .textarea { resize: vertical; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .select-pill { border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 7px 12px; font-size: 12.5px; color: var(--ink); display: flex; align-items: center; }
  .select-pill.active { border-color: var(--asphalt); background: var(--asphalt); color: var(--paper); }
  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .secondary-btn, .primary-btn { flex: 1; border: none; border-radius: 10px; padding: 12px 0; font-size: 14.5px; font-weight: 600; }
  .secondary-btn { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
  .primary-btn { background: var(--road-yellow); font-weight: 700; color: var(--asphalt); }
  .primary-btn:disabled { opacity: 0.5; }
  .toast { position: fixed; bottom: 84px; left: 12px; right: 12px; max-width: 456px; margin: 0 auto; background: var(--stop-red); color: white; padding: 10px 14px; border-radius: 10px; font-size: 13px; z-index: 100; }

  .dashboard { padding: 14px 16px 0; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat-label { font-size:11.5px; color:var(--muted); }
  .stat-value { font-size:22px; color:var(--ink); margin-top:4px; }
  .green { color:var(--go-green)!important; }
  .red { color:var(--stop-red)!important; }
  
  .payment-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .payment-summary-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center; margin-bottom: 12px; }
  .pay-stat-val { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .pay-btn { width: 100%; background: rgba(245,183,0,0.15); border: 1px solid var(--road-yellow); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-weight: 700; color: var(--asphalt); display: flex; align-items: center; justify-content: center; gap: 6px; }

  .payment-card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
  .payment-top { display:flex; justify-content:space-between; gap:8px; }
  .payment-amount { font-size:16px; font-weight:700; }
  .payment-meta { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .quick-row { display:flex; gap:8px; padding:12px 16px 0; }
  .quick-btn { flex:1; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 6px; font-weight:600; color:var(--ink); }
  @media(max-width:360px){.dashboard{grid-template-columns:1fr}.quick-row{flex-direction:column}}

  .report-wrap { padding:14px 16px 24px; }
  .report-month { margin-bottom:12px; }
  .report-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .report-table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:12.5px; }
  .report-table th,.report-table td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; }
  .report-table th { color:var(--muted); font-weight:600; background:var(--paper); }
  .report-table tr:last-child td { border-bottom:none; }
  .expense-card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; }
  .expense-title { font-weight:650; color:var(--ink); }
  .expense-meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .report-actions { display:flex; gap:8px; margin:10px 0 4px; }
  .report-actions button { flex:1; }
  svg { display: block; }

  /* ---- v1.4 additions ---- */
  .progress-fill.done { background: var(--go-green); }
  .section-head { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; margin:12px 2px 8px; }
  .section-head .count { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1px 9px; font-size:12px; letter-spacing:0; }
  .student-card.completed { background:#F4F9F6; border-color:rgba(47,143,91,.35); }
  .badge-pill { display:inline-block; font-size:10.5px; font-weight:700; border-radius:10px; padding:1px 7px; margin-left:6px; vertical-align:middle; letter-spacing:.3px; }
  .badge-done { color:var(--go-green); background:rgba(47,143,91,.13); }
  .badge-new { color:#8a6400; background:rgba(245,183,0,.25); }
  .card-row { display:flex; gap:8px; width:100%; }
  .lesson-quick { flex:1; background:var(--road-yellow); border:none; border-radius:8px; padding:8px 10px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--asphalt); }
  .card-row .welcome-btn { width:auto; flex:1; }
  .bottom-bar { position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:6; background:var(--card); border-top:1px solid var(--line); padding:10px 14px; box-shadow:0 -4px 14px rgba(0,0,0,.08); }
  .bottom-bar .fab { margin:0; }
  .tabbar { position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:6; display:flex; background:var(--asphalt); }
  .tab-btn { flex:1; background:none; border:none; color:#9AA1AB; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:700; }
  .tab-btn.active { color:var(--road-yellow); }
  .spacer { height:84px; }
  .modal-back { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:var(--card); border-radius:14px; padding:18px; max-width:380px; width:100%; }
  .danger-btn { flex:1; background:var(--stop-red); color:#fff; border:none; border-radius:10px; padding:12px 0; font-size:14.5px; font-weight:700; }
  .quick-btn.danger { color:var(--stop-red); border-color:rgba(214,69,69,.45); }
  .quick-btn.edit { display:flex; align-items:center; justify-content:center; gap:6px; }
  .pick-btn { width:100%; background:rgba(47,143,91,.08); border:1px dashed rgba(47,143,91,.6); border-radius:10px; padding:11px 12px; font-size:14px; font-weight:700; color:var(--go-green); display:flex; align-items:center; justify-content:center; gap:8px; }
  .locked-box { text-align:center; }
  .locked-title { font-size:15px; font-weight:700; color:var(--ink); margin:6px 0 10px; }
  .fin-row { cursor:pointer; }
  .complete-chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--go-green); background:rgba(47,143,91,.12); border-radius:12px; padding:3px 10px; margin-bottom:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

function svg(inner, size, color, stroke) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' +
    (color || 'currentColor') + '" stroke-width="' + (stroke || 2) +
    '" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
}
const ICONS = {
  plus: (s, c) => svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', s, c),
  back: (s, c) => svg('<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>', s, c),
  chat: (s, c) => svg('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>', s, c),
  phone: (s, c) => svg('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>', s, c),
  clock: (s, c) => svg('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', s, c),
  cal: (s, c) => svg('<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>', s, c),
  chev: (s, c) => svg('<polyline points="9 18 15 12 9 6"/>', s, c),
  check: (s, c) => svg('<polyline points="20 6 9 17 4 12"/>', s, c),
  gauge: (s, c) => svg('<path d="M12 15l3.5-3.5"/><path d="M20.6 15A9 9 0 1 0 3.4 15"/>', s, c),
  car: (s, c) => svg('<path d="M5 17h14M5 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm14 0a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM3 17V11l2-5h14l2 5v6"/>', s, c),
  bike: (s, c) => svg('<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2zM12 17.5V14l-3-3 4-3 2 3h2"/>', s, c),
  truck: (s, c) => svg('<rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>', s, c),
  users: (s, c) => svg('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', s, c),
  lock: (s, c) => svg('<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', s, c),
  edit: (s, c) => svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>', s, c),
  trash: (s, c) => svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>', s, c),
  contact: (s, c) => svg('<path d="M4 4h14a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 17a4.5 4.5 0 0 1 9 0"/>', s, c),
  wallet: (s, c) => svg('<path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2 2 2 0 0 0 2 2h4v-4h-4z"/>', s, c),
};

const LICENSE_TYPES = [
  { id: "two-wheeler", label: "Two-Wheeler", icon: "bike" },
  { id: "car-manual", label: "Car — Manual", icon: "car" },
  { id: "car-auto", label: "Car — Automatic", icon: "car" },
  { id: "commercial", label: "Commercial / Heavy", icon: "truck" },
];

const SKILL_OPTIONS = [
  "Clutch control", "Steering", "Braking", "Parking",
  "Reverse driving", "Lane changing", "Highway driving",
  "Night driving", "Traffic navigation", "Parallel parking",
  "Mock test",
];

const RATINGS = [
  { id: "needs-practice", label: "Needs practice", color: "var(--stop-red)" },
  { id: "satisfactory", label: "Satisfactory", color: "#B8860B" },
  { id: "good", label: "Good", color: "var(--go-green)" },
  { id: "excellent", label: "Excellent", color: "#1F6E48" },
];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDate(iso) {
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function digitsOnly(s) { return (s || "").replace(/[^\d]/g, ""); }
function escapeHtml(s) {
  return (s == null ? "" : String(s)).replace(/[&<>"']/g, (m) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}
function licenseInfo(id) { return LICENSE_TYPES.find((l) => l.id === id) || LICENSE_TYPES[1]; }
function ratingInfo(id) { return RATINGS.find((r) => r.id === id) || RATINGS[2]; }

function storageGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { return false; }
}

const state = {
  students: storageGet("students", []),
  lessonsByStudent: {},
  paymentsByStudent: {},
  expenses: storageGet("expenses", []),
  reportMonth: todayISO().slice(0,7),
  view: { name: "list" },
  error: "",
  draft: {},
  financeUnlocked: false,
  confirm: null,
};

state.students.forEach((s) => { 
  state.lessonsByStudent[s.id] = storageGet("lessons:" + s.id, []); 
  state.paymentsByStudent[s.id] = storageGet("payments:" + s.id, []); 
});

function activeStudent() {
  return state.students.find((s) => s.id === state.view.studentId) || null;
}
function hoursCompleted(studentId) {
  const entries = state.lessonsByStudent[studentId] || [];
  return entries.reduce((sum, l) => sum + (Number(l.durationMinutes) || 0), 0) / 60;
}
function paymentsTotal(studentId) {
  return (state.paymentsByStudent[studentId] || []).reduce((sum,p) => sum + (Number(p.amount)||0), 0);
}
function totalCourseFee(s) { return Number(s.courseFee) || 0; }
function balanceFor(s) { return Math.max(0, totalCourseFee(s) - paymentsTotal(s.id)); }
function money(n) { return "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2}); }

function showError(msg) { state.error = msg; render(); setTimeout(() => { state.error = ""; render(); }, 3500); }

/* ---------- training status + ordering ---------- */
function isCompleted(s) {
  if (s.manualComplete === true) return true;
  const plan = Number(s.totalHoursPlanned) || 0;
  return plan > 0 && hoursCompleted(s.id) + 1e-9 >= plan;
}
function createdTs(s) {
  if (s.createdAt) return Number(s.createdAt) || 0;
  const n = parseInt(String(s.id || "").slice(0, 8), 36);   // ids start with Date.now() in base36
  return isNaN(n) ? 0 : n;
}
function lastActivityKey(s) {
  const ds = (state.lessonsByStudent[s.id] || []).map((l) => String(l.date || ""));
  ds.sort();
  return ds.length ? ds[ds.length - 1] : String(s.startDate || "");
}
function sortedStudents() {
  const active = [], finished = [];
  state.students.forEach((s) => (isCompleted(s) ? finished : active).push(s));
  active.sort((a, b) => createdTs(b) - createdTs(a));                       // newest / still training first
  finished.sort((a, b) => lastActivityKey(b).localeCompare(lastActivityKey(a)) || createdTs(b) - createdTs(a));
  return { active: active, finished: finished };
}

/* ---------- native (Android) bridge helpers ---------- */
function nativeHas(fn) { return !!(window.Android && typeof window.Android[fn] === "function"); }
let authCb = null;
function requireAuth(cb) {
  if (state.financeUnlocked) { cb(); return; }
  if (!nativeHas("authenticate")) { state.financeUnlocked = true; cb(); return; }   // plain browser: no lock available

}

function normalizePhone(raw) {
  const p = String(raw || "").trim();
  const plus = p.charAt(0) === "+";
  const d = p.replace(/[^\d]/g, "");
  if (!d) return "+91";
  if (plus) return "+" + d;
  if (d.indexOf("00") === 0) return "+" + d.slice(2);
  if (d.length === 10) return "+91" + d;
  if (d.length === 11 && d.charAt(0) === "0") return "+91" + d.slice(1);
  if (d.length === 12 && d.indexOf("91") === 0) return "+" + d;
  return d;
}
window.__contactPicked = function (name, number) {
  const n = state.view.name;
  if (n !== "addStudent" && n !== "editStudent") return;
  if (name) state.draft.name = name;

};

async function exportData() {
    try {
        const data = {
            version: 3,
            exportedAt: new Date().toISOString(),
            students: state.students,
            lessons: state.lessonsByStudent,
            payments: state.paymentsByStudent,
            expenses: state.expenses
        };

        const json = JSON.stringify(data, null, 2);

        const fileName =
            "driving_lessons_backup_" +
            new Date().toISOString().slice(0, 10) +
            ".json";

        // =====================================================
        // ANDROID APP
        // =====================================================
        if (
            window.Android &&
            typeof window.Android.saveBackup === "function"
        ) {
            window.Android.saveBackup(fileName, json);

            return;
        }

        // =====================================================
        // NORMAL WEB BROWSER
        // =====================================================

        const blob = new Blob(
            [json],
            { type: "application/json" }
        );

        // Web Share API
        if (
            navigator.share &&
            navigator.canShare
        ) {

            const file = new File(
                [blob],
                fileName,
                { type: "application/json" }
            );

            if (
                navigator.canShare({
                    files: [file]
                })
            ) {

                await navigator.share({
                    title: "Driving Lessons Backup",
                    text: "Driving Lessons app backup",
                    files: [file]
                });

                return;
            }
        }

        // Browser fallback
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = fileName;

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 1000);

    } catch (error) {

        console.error("Backup error:", error);

        alert(
            "Backup failed: " +
            (error.message || error)
        );
    }
}
  function importData() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json,text/json";
  input.style.display = "none";
  input.onchange = async () => {
    const f = input.files && input.files[0];
    if (!f) { try { document.body.removeChild(input); } catch (e) {} return; }
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.students)) throw new Error("Invalid structure");
      state.students = data.students;
      state.lessonsByStudent = data.lessons || {};
      state.paymentsByStudent = data.payments || {};
      state.expenses = Array.isArray(data.expenses) ? data.expenses : [];

      storageSet("students", state.students);
      storageSet("expenses", state.expenses);
      state.students.forEach(s => {
        storageSet("lessons:" + s.id, state.lessonsByStudent[s.id] || []);
        storageSet("payments:" + s.id, state.paymentsByStudent[s.id] || []);
      });

      goto({ name: "list" });
      try { document.body.removeChild(input); } catch (e) {}
    } catch (e) {
      showError("Invalid backup JSON file.");
      try { document.body.removeChild(input); } catch (x) {}
    }
  };
  document.body.appendChild(input);
  input.click();
}

function studentListHtml() {
  const addBtn = '<button class="fab" id="btn-add-student" style="margin-top:14px">' + ICONS.plus(20, "var(--asphalt)") + '<span style="margin-left:6px">New student</span></button>';
  if (state.students.length === 0) {
    return '<div class="empty"><div class="empty-title display">No students yet</div>' +
      '<div class="empty-body">Add your first student to start logging lessons and payments.</div></div>' + addBtn;
  }
  const g = sortedStudents();
  let html = addBtn;
  if (g.active.length) {
    html += '<div class="section-head"><span>Under training / new</span><span class="count">' + g.active.length + '</span></div>' + g.active.map(studentCardHtml).join("");
  }
  if (g.finished.length) {
    html += '<div class="section-head"><span>Completed training</span><span class="count">' + g.finished.length + '</span></div>' + g.finished.map(studentCardHtml).join("");
  }
  return html + '<div class="spacer"></div>';
}

function studentDetailHtml(s) {
  const lessons = state.lessonsByStudent[s.id] || [];
  const done = hoursCompleted(s.id);
  const li = licenseInfo(s.licenseType);
  const rec = paymentsTotal(s.id);
  const fee = totalCourseFee(s);
  const bal = balanceFor(s);
  const completed = isCompleted(s);

  let timelineHtml;
  if (lessons.length === 0) {
    timelineHtml = '<div class="empty"><div class="empty-title display">No lessons logged yet</div>' +
      '<div class="empty-body">Log today\'s session to start the timeline.</div></div>';
  } else {
    timelineHtml = lessons.map((l, i) => {
      const chips = (l.skills || []).map((sk) => '<span class="chip">' + escapeHtml(sk) + '</span>').join("");
      const r = ratingInfo(l.rating);
      return '<div class="timeline-row">' +
        '<div class="timeline-marker-col"><div class="timeline-dot"></div>' + (i < lessons.length - 1 ? '<div class="timeline-line"></div>' : '') + '</div>' +
        '<div class="lesson-card">' +
          '<div class="lesson-top-row">' +
            '<div class="lesson-date">' + ICONS.cal(14) + ' ' + formatDate(l.date) + '</div>' +
            '<div class="lesson-duration">' + ICONS.clock(14) + ' ' + l.durationMinutes + ' min</div>' +
          '</div>' +
          (chips ? '<div class="skill-chips">' + chips + '</div>' : '') +
          (l.notes ? '<div class="lesson-notes">' + escapeHtml(l.notes) + '</div>' : '') +
          '<div class="lesson-bottom-row">' +
            '<span class="rating-pill" style="color:' + r.color + '">' + r.label + '</span>' +
            '<button class="share-link" data-share-lesson="' + l.id + '">' + ICONS.chat(14) + ' Share</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join("");
    timelineHtml = '<div class="timeline">' + timelineHtml + '</div>';
  }

  const moneyHtml = state.financeUnlocked
    ? '<div class="payment-box">' +
        '<div class="payment-summary-row">' +
          '<div><div class="stat-label">COURSE FEE</div><div class="pay-stat-val">' + money(fee) + '</div></div>' +
          '<div><div class="stat-label">RECEIVED</div><div class="pay-stat-val green">' + money(rec) + '</div></div>' +
          '<div><div class="stat-label">BALANCE</div><div class="pay-stat-val red">' + money(bal) + '</div></div>' +
        '</div>' +
        '<button class="pay-btn" id="btn-add-payment">' + ICONS.wallet(16, "var(--asphalt)") + ' ＋ Add received payment</button>' +
      '</div>' +
      '<div class="section-label display">Payment history</div>' + paymentListHtml(s)
    : '<div class="payment-box locked-box">' + ICONS.lock(22, "var(--muted)") +
        '<div class="locked-title">Fees &amp; payments are hidden</div>' +
        '<button class="pay-btn" id="btn-unlock-pay">🔓 Unlock to view</button>' +
      '</div>';

  return (
    '<div class="detail-header">' +
      (completed ? '<div class="complete-chip">' + ICONS.check(13, "var(--go-green)") + ' Training completed</div>' : '') +
      '<div class="detail-meta-row"><span>' + li.label + '</span><span>· Started ' + formatDate(s.startDate) + '</span></div>' +
      '<div class="hours-row"><span class="hours-big display">' + done.toFixed(1) + '</span><span class="hours-small">/ ' + s.totalHoursPlanned + ' hrs</span></div>' +
      progressBarHtml(done, s.totalHoursPlanned, completed) +
      '<button class="summary-btn" id="btn-share-welcome" style="margin-top:14px; background: rgba(245,183,0,0.15); border-color: var(--road-yellow); color: var(--asphalt);">' + ICONS.chat(16, "var(--asphalt)") + '<span style="margin-left:8px">Send Welcome T&amp;C</span></button>' +
      '<button class="summary-btn" id="btn-share-summary">' + ICONS.chat(16, "var(--go-green)") + '<span style="margin-left:8px">Send progress summary on WhatsApp</span></button>' +
      '<div class="card-row" style="margin-top:10px">' +
        '<button class="quick-btn edit" id="btn-edit-student">' + ICONS.edit(15, "var(--ink)") + ' Edit</button>' +
        '<button class="quick-btn edit danger" id="btn-delete-student">' + ICONS.trash(15, "var(--stop-red)") + ' Delete</button>' +
      '</div>' +
    '</div>' +

    moneyHtml +

    '<div class="section-label display">Lesson history</div>' +
    timelineHtml +
    '<div class="spacer"></div>' +
    '<div class="bottom-bar"><button class="fab" id="btn-add-lesson">' + ICONS.plus(20, "var(--asphalt)") + '<span style="margin-left:6px">Log today\'s lesson</span></button></div>'
  );
}

function fieldHtml(label, inner) {
  return '<label class="field"><span class="field-label">' + label + '</span>' + inner + '</label>';
}

function addStudentFormHtml() {
  const d = state.draft;
  const editing = state.view.name === "editStudent";
  const es = editing ? activeStudent() : null;
  if (d.name === undefined) d.name = es ? es.name : "";
  if (d.phone === undefined) d.phone = es ? es.phone : "+91";
  if (d.licenseType === undefined) d.licenseType = es ? es.licenseType : LICENSE_TYPES[1].id;
  if (d.totalHoursPlanned === undefined) d.totalHoursPlanned = es ? es.totalHoursPlanned : 20;
  if (d.courseFee === undefined) d.courseFee = es ? es.courseFee : 5000;
  if (d.startDate === undefined) d.startDate = es ? es.startDate : todayISO();
  if (d.manualComplete === undefined) d.manualComplete = es ? es.manualComplete === true : false;

  const licensePills = LICENSE_TYPES.map((lt) =>
    '<button type="button" class="select-pill' + (d.licenseType === lt.id ? ' active' : '') + '" data-set-license="' + lt.id + '">' + lt.label + '</button>'
  ).join("");

  const canSave = d.name.trim().length > 0 && digitsOnly(d.phone).length >= 8;

  const statusField = editing
    ? fieldHtml("Training status",
        '<div class="pill-row">' +
          '<button type="button" class="select-pill' + (!d.manualComplete ? ' active' : '') + '" data-set-complete="auto">Auto (by hours)</button>' +
          '<button type="button" class="select-pill' + (d.manualComplete ? ' active' : '') + '" data-set-complete="yes">Mark as completed</button>' +
        '</div>')
    : '';

  return (
    '<button type="button" class="pick-btn" id="btn-pick-contact">' + ICONS.contact(18, "var(--go-green)") + ' Fill from phone contacts</button>' +
    fieldHtml("Student name", '<input class="input" id="f-name" value="' + escapeHtml(d.name) + '" placeholder="e.g. Priya Sharma" />') +
    fieldHtml("WhatsApp number", '<input class="input" id="f-phone" value="' + escapeHtml(d.phone) + '" placeholder="+91 98765 43210" />') +
    fieldHtml("License type", '<div class="pill-row">' + licensePills + '</div>') +
    fieldHtml("Planned course hours", '<input class="input" id="f-hours" type="number" min="1" value="' + d.totalHoursPlanned + '" />') +
    fieldHtml("Total course fee (₹)", '<input class="input" id="f-fee" type="number" min="0" value="' + d.courseFee + '" />') +
    fieldHtml("Start date", '<input class="input" id="f-start" type="date" value="' + d.startDate + '" />') +
    statusField +
    '<div class="form-actions">' +
      '<button class="secondary-btn" id="btn-cancel-student">Cancel</button>' +
      '<button class="primary-btn" id="btn-save-student" ' + (canSave ? "" : "disabled") + '>' + (editing ? 'Save changes' : 'Save student') + '</button>' +
    '</div>' +
    (editing ? '<button type="button" class="danger-btn" id="btn-delete-student" style="width:100%;flex:none">Delete this student</button>' : '')
  );
}

    fieldHtml("Rating", '<div class="pill-row">' + ratingPills + '</div>') +

function render() {
  const root = document.getElementById("root");
  const v = state.view;
  let bodyHtml = "";
  let wrapClass = "list-wrap";

  if (v.name === "list") {
    bodyHtml = dashboardHtml() +
      '<div class="quick-row" style="padding:12px 0 0"><button class="quick-btn" id="btn-export">⬇ Backup</button><button class="quick-btn" id="btn-import">⬆ Restore</button></div>' +
      studentListHtml();
  } else if (v.name === "finance") {
    bodyHtml = financeHtml();
  } else if (v.name === "addStudent" || v.name === "editStudent") {
    wrapClass = "form-wrap";
    bodyHtml = (v.name === "editStudent" && !activeStudent()) ? "" : addStudentFormHtml();
  } else if (v.name === "detail") {
    const s = activeStudent();
    bodyHtml = s ? studentDetailHtml(s) : "";
  } else if (v.name === "addLesson") {
    const s = activeStudent();
    wrapClass = "form-wrap";
    bodyHtml = s ? addLessonFormHtml(s) : "";
  } else if (v.name === "addPayment") {
    const s = activeStudent();
    wrapClass = "form-wrap";
    bodyHtml = s ? paymentFormHtml(s) : "";
  } else if (v.name === "reports") {
    bodyHtml = reportHtml();
  } else if (v.name === "addExpense") {
    wrapClass = "form-wrap";
    bodyHtml = expenseFormHtml();
  }

  const bt = backTarget();
  if (bt) {
    bodyHtml = '<button class="back-nav-btn" id="btn-body-back">' + ICONS.back(18, "var(--ink)") + '<span>' + backLabel(bt) + '</span></button>' + bodyHtml;
  }

  root.innerHTML =
    '<div class="phone">' +
      topBarHtml() +
      '<div class="body"><div class="' + wrapClass + '">' + bodyHtml + '</div></div>' +
      (state.error ? '<div class="toast" id="toast">' + escapeHtml(state.error) + '</div>' : '') +
      tabBarHtml() +
      confirmHtml() +
    '</div>';

  bindEvents();
}

function bindEvents() {
  const root = document.getElementById("root");

  const back = root.querySelector("#btn-back");
  if (back) back.onclick = goBack;
  const bodyBack = root.querySelector("#btn-body-back");
  if (bodyBack) bodyBack.onclick = goBack;

  const lockNow = root.querySelector("#btn-lock-now");
  if (lockNow) lockNow.onclick = () => window.Android.lockNow();

  root.querySelectorAll("[data-tab]").forEach((el) => {
    el.onclick = () => {
      const tab = el.getAttribute("data-tab");
      if (tab === state.view.name) return;
      if (tab === "finance") requireAuth(() => goto({ name: "finance" }));
      else goto({ name: "list" });
    };
  });
  const lockFin = root.querySelector("#btn-lock-fin");
  if (lockFin) lockFin.onclick = () => goto({ name: "list" });
  root.querySelectorAll("[data-open-fin]").forEach((el) => {
    el.onclick = () => goto({ name: "detail", studentId: el.getAttribute("data-open-fin"), from: "finance" });
  });
  const unlockPay = root.querySelector("#btn-unlock-pay");
  if (unlockPay) unlockPay.onclick = () => requireAuth(() => render());

  /* edit / delete student */
  root.querySelectorAll("[data-edit-student]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); goto({ name: "editStudent", studentId: el.getAttribute("data-edit-student") }); };
  });
  root.querySelectorAll("[data-quick-lesson]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); goto({ name: "addLesson", studentId: el.getAttribute("data-quick-lesson"), origin: "list" }); };
  });
  const editBtn = root.querySelector("#btn-edit-student");
  if (editBtn) editBtn.onclick = () => goto({ name: "editStudent", studentId: activeStudent().id, from: state.view.from });
  const delBtn = root.querySelector("#btn-delete-student");
  if (delBtn) delBtn.onclick = () => { state.confirm = { kind: "deleteStudent", id: activeStudent().id }; render(); };
  const confNo = root.querySelector("#btn-confirm-no");
  if (confNo) confNo.onclick = () => { state.confirm = null; render(); };
  const confBack = root.querySelector("#modal-back");
  if (confBack) confBack.onclick = (e) => { if (e.target === confBack) { state.confirm = null; render(); } };
  const confYes = root.querySelector("#btn-confirm-yes");
  if (confYes) confYes.onclick = () => { const id = state.confirm && state.confirm.id; state.confirm = null; if (id) deleteStudent(id); };

  const pickBtn = root.querySelector("#btn-pick-contact");
  if (pickBtn) pickBtn.onclick = () => {
    if (nativeHas("pickContact")) window.Android.pickContact();
    else showError("Picking from contacts works inside the Android app.");
  };

  const addStudentBtn = root.querySelector("#btn-add-student");
  if (addStudentBtn) addStudentBtn.onclick = () => {
    goto({ name: "addStudent" });
    // Inside the Android app, go straight to the phone's contact list.
    // (If you cancel there, the empty form is ready for manual entry.)
    if (nativeHas("pickContact")) setTimeout(() => window.Android.pickContact(), 150);
  };

  root.querySelectorAll("[data-open]").forEach((el) => {
    el.onclick = () => goto({ name: "detail", studentId: el.getAttribute("data-open") });
  });

  root.querySelectorAll(".card-row button, .student-actions .action-btn").forEach((el) => {
    el.addEventListener("click", (e) => e.stopPropagation());
  });

  root.querySelectorAll("[data-card-wa]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      const sid = el.getAttribute("data-card-wa");
      const s = state.students.find(st => st.id === sid);
      if (s) openWhatsApp(s.phone, summaryMessage(s));
    };
  });

  root.querySelectorAll("[data-welcome-wa]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      const sid = el.getAttribute("data-welcome-wa");
      const s = state.students.find(st => st.id === sid);
      if (s) openWhatsApp(s.phone, welcomeMessage(s));
    };
  });

  const exportBtn = root.querySelector("#btn-export");
  if (exportBtn) exportBtn.onclick = exportData;
  const importBtn = root.querySelector("#btn-import");
  if (importBtn) importBtn.onclick = importData;
  const reportsBtn = root.querySelector("#btn-reports");
  if (reportsBtn) reportsBtn.onclick = () => goto({name:"reports"});
  const reportMonth = root.querySelector("#report-month");
  if (reportMonth) reportMonth.oninput = e => { state.reportMonth=e.target.value; render(); };
  const addExpenseBtn = root.querySelector("#btn-add-expense");
  if (addExpenseBtn) addExpenseBtn.onclick = () => goto({name:"addExpense"});

  const addPaymentBtn = root.querySelector("#btn-add-payment");
  if (addPaymentBtn) addPaymentBtn.onclick = () => goto({ name: "addPayment", studentId: activeStudent().id, from: state.view.from });

  const addLessonBtn = root.querySelector("#btn-add-lesson");
  if (addLessonBtn) addLessonBtn.onclick = () => goto({ name: "addLesson", studentId: activeStudent().id, from: state.view.from });

  const shareWelcomeBtn = root.querySelector("#btn-share-welcome");
  if (shareWelcomeBtn) shareWelcomeBtn.onclick = () => {
    const s = activeStudent();
    openWhatsApp(s.phone, welcomeMessage(s));
  };

  const shareSummaryBtn = root.querySelector("#btn-share-summary");
  if (shareSummaryBtn) shareSummaryBtn.onclick = () => {
    const s = activeStudent();
    openWhatsApp(s.phone, summaryMessage(s));
  };

  root.querySelectorAll("[data-share-lesson]").forEach((el) => {
    el.onclick = () => {
      const s = activeStudent();
      const lesson = (state.lessonsByStudent[s.id] || []).find((l) => l.id === el.getAttribute("data-share-lesson"));
      if (lesson) openWhatsApp(s.phone, lessonMessage(s, lesson));
    };
  });

  const toast = root.querySelector("#toast");
  if (toast) toast.onclick = () => { state.error = ""; render(); };

  /* Add Student */
  const fName = root.querySelector("#f-name");
  if (fName) {
    fName.oninput = (e) => { state.draft.name = e.target.value; syncSaveStudentButton(); };
    const fPhone = root.querySelector("#f-phone");
    fPhone.oninput = (e) => { state.draft.phone = e.target.value; syncSaveStudentButton(); };
    root.querySelectorAll("[data-set-license]").forEach((el) => {
      el.onclick = () => { state.draft.licenseType = el.getAttribute("data-set-license"); render(); refocus("#f-name"); };
    });
    root.querySelector("#f-hours").oninput = (e) => { state.draft.totalHoursPlanned = Number(e.target.value) || 0; };
    root.querySelector("#f-fee").oninput = (e) => { state.draft.courseFee = Number(e.target.value) || 0; };
    root.querySelector("#f-start").oninput = (e) => { state.draft.startDate = e.target.value; };
    root.querySelectorAll("[data-set-complete]").forEach((el) => {
      el.onclick = () => { state.draft.manualComplete = el.getAttribute("data-set-complete") === "yes"; render(); };
    });
    root.querySelector("#btn-cancel-student").onclick = goBack;
    root.querySelector("#btn-save-student").onclick = () => {
      const d = state.draft;
      if (!(d.name.trim().length > 0 && digitsOnly(d.phone).length >= 8)) return;
      const fields = {
        name: d.name.trim(), phone: d.phone.trim(),
        licenseType: d.licenseType, totalHoursPlanned: d.totalHoursPlanned, courseFee: d.courseFee, startDate: d.startDate,
      };
      if (state.view.name === "editStudent") {
        fields.manualComplete = d.manualComplete === true;
        updateStudent(state.view.studentId, fields);
      } else {
        fields.id = uid();
        fields.createdAt = Date.now();
        addStudent(fields);
      }
    };
  }

  /* Add Lesson */
  const fDate = root.querySelector("#f-date");
  if (fDate) {
    fDate.oninput = (e) => { state.draft.date = e.target.value; };
    root.querySelector("#f-duration").oninput = (e) => { state.draft.durationMinutes = Number(e.target.value) || 0; };
    root.querySelectorAll("[data-toggle-skill]").forEach((el) => {
      el.onclick = () => {
        const sk = el.getAttribute("data-toggle-skill");
        const list = state.draft.skills;
        const idx = list.indexOf(sk);
        if (idx === -1) list.push(sk); else list.splice(idx, 1);
        render();
      };
    });
    root.querySelector("#f-notes").oninput = (e) => { state.draft.notes = e.target.value; };
    root.querySelectorAll("[data-set-rating]").forEach((el) => {
      el.onclick = () => { state.draft.rating = el.getAttribute("data-set-rating"); render(); };
    });
    root.querySelector("#btn-cancel-lesson").onclick = goBack;
    root.querySelector("#btn-save-lesson").onclick = () => {
      const d = state.draft;
      const s = activeStudent();
      addLesson(s.id, {
        id: uid(), date: d.date, durationMinutes: d.durationMinutes,
        skills: d.skills, notes: d.notes.trim(), rating: d.rating,
      });
    };
  }

  /* Add Payment */
  const pAmount = root.querySelector("#p-amount");
  if (pAmount) {
    pAmount.oninput = e => { state.draft.amount = Number(e.target.value)||0; };
    root.querySelector("#p-date").oninput = e => { state.draft.date=e.target.value; };
    root.querySelector("#p-note").oninput = e => { state.draft.note=e.target.value; };
    root.querySelectorAll("[data-pay-method]").forEach(el => el.onclick=()=>{state.draft.method=el.getAttribute("data-pay-method");render();});
    root.querySelector("#btn-cancel-payment").onclick=goBack;
    root.querySelector("#btn-save-payment").onclick=()=>{
      const d=state.draft,s=activeStudent();
      if(!(Number(d.amount)>0)) return showError("Enter a valid payment amount.");
      addPayment(s.id,{id:uid(),amount:Number(d.amount),date:d.date,method:d.method,note:(d.note||"").trim()});
    };
  }

  /* Add Expense */
  const eAmount = root.querySelector("#e-amount");
  if (eAmount) {
    eAmount.oninput=e=>{state.draft.amount=Number(e.target.value)||0;};
    root.querySelector("#e-date").oninput=e=>{state.draft.date=e.target.value;};
    root.querySelector("#e-note").oninput=e=>{state.draft.note=e.target.value;};
    root.querySelectorAll("[data-exp-category]").forEach(el=>el.onclick=()=>{state.draft.category=el.getAttribute("data-exp-category");render();});
    root.querySelector("#btn-cancel-expense").onclick=goBack;
    root.querySelector("#btn-save-expense").onclick=()=>{const d=state.draft;if(!(Number(d.amount)>0))return showError("Enter a valid expense amount.");addExpense({id:uid(),amount:Number(d.amount),date:d.date,category:d.category,note:(d.note||"").trim()});};
  }
}

function syncSaveStudentButton() {
  const btn = document.getElementById("btn-save-student");
  if (!btn) return;
  const d = state.draft;
  btn.disabled = !(d.name.trim().length > 0 && digitsOnly(d.phone).length >= 8);
}
function refocus(sel) {
  const el = document.querySelector(sel);
  if (el) el.focus();
}

render();

// Service Worker handling for dynamic updates without requiring uninstall
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").then((reg) => {
      // Periodically check for updates
      reg.addEventListener("updatefound", () => {
        const installingWorker = reg.installing;
        if (installingWorker) {
          installingWorker.onstatechange = () => {
            if (installingWorker.state === "installed" && navigator.serviceWorker.controller) {
              // Automatically reload to apply update without uninstalling
              window.location.reload();
            }
          };
        }
      });
    }).catch(() => {});
  });
}
</script>
</body>
