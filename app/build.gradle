plugins {
    id 'com.android.application'
}

android {
    namespace 'com.drivinglessons.drivelog'
    compileSdk 35

    defaultConfig {
        applicationId 'com.drivinglessons.drivelog'
        minSdk 23
        targetSdk 35

        // IMPORTANT FOR APK UPDATE
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/drivelog-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
