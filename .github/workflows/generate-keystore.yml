name: One-time - Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17 (includes keytool)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ---------------------------------------------------------
      # IMPORTANT: change this password to your own before running,
      # by editing this file in GitHub first. Whatever you put here
      # is the password you will later re-enter as the
      # KEYSTORE_PASSWORD and KEY_PASSWORD GitHub Secrets.
      # ---------------------------------------------------------
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore drivelog-release.keystore \
            -alias drivelog \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "ChangeThisPassword123" \
            -keypass "ChangeThisPassword123" \
            -dname "CN=DriveLog, OU=Dev, O=DrivingLessons, L=Pune, S=Maharashtra, C=IN"

      - name: Base64-encode the keystore
        run: base64 -w 0 drivelog-release.keystore > keystore_base64.txt

      - name: Upload keystore + base64 text
        uses: actions/upload-artifact@v4
        with:
          name: drivelog-keystore-DO-NOT-SHARE
          path: |
            drivelog-release.keystore
            keystore_base64.txt
